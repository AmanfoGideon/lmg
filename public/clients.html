<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients - BizMgr</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="dashboard.html">BizMgr</a>
    <button id="btnLogout" class="btn btn-outline-light btn-sm">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <h3>Clients</h3>
  <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#clientModal">Add Client</button>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Address</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="clientsTable">
      <!-- Loaded via JS -->
    </tbody>
  </table>
</div>

<!-- Add/Edit Client Modal -->
<div class="modal fade" id="clientModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h5 class="modal-title">Client</h5>
      <input type="hidden" id="clientId">
      <input class="form-control mb-2" id="clientName" placeholder="Full Name">
      <input class="form-control mb-2" id="clientPhone" placeholder="Phone">
      <input class="form-control mb-2" id="clientEmail" placeholder="Email">
      <textarea class="form-control mb-2" id="clientAddress" placeholder="Address"></textarea>
      <button id="saveClient" class="btn btn-primary w-100">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/clients.js"></script>
</body>
</html>
