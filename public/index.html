<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1720">
  <title>Sign In | LMG Creative Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="js/vendor.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="manifest" href="pwa-manifest.webmanifest">
  <link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
  <style>
    /* Premium Critical CSS */
    :root {
      --bg-dark: #0a0f14;
      --bg-card: rgba(255, 255, 255, 0.05);
      --accent: #FFD700;
      --text-main: #e6eef5;
      --text-muted: rgba(230, 238, 245, 0.6);
    }
    html, body { 
      background: var(--bg-dark); 
      color: var(--text-main); 
      margin: 0; 
      font-family: 'Inter', -apple-system, sans-serif; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .loading-screen { 
      position: fixed; 
      inset: 0; 
      background: var(--bg-dark); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      transition: opacity 0.3s ease;
    }
    .loading-spinner { 
      width: 48px; 
      height: 48px; 
      border: 4px solid rgba(255,215,0,0.1); 
      border-top-color: var(--accent); 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-container { opacity: 0; transition: opacity 0.5s ease; }
    body.loaded .login-container { opacity: 1; }
    .card { background: var(--bg-card) !important; backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="d-flex flex-column">
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-spinner"></div>
  </div>
  <main class="login-container d-flex flex-column justify-content-center align-items-center px-3 py-5 flex-grow-1">
    <img src="images/logo.png" class="logo mb-3" alt="LMG Creative Media" width="100" height="100">
    <h1 class="h2 text-mtn-yellow fw-bold text-center" style="color: var(--accent) !important;">LMG Creative Media</h1>
    <p class="text-light text-center mb-4">Business management</p>

    <section class="card login-card shadow-lg p-4 w-100" style="max-width: 420px; border-radius: 20px;" aria-labelledby="authTitle">
      <h2 id="authTitle" class="h4 text-center mb-4 fw-bold" style="color: var(--text-main) !important;">Sign In</h2>
      <div id="authMessage" class="alert d-none" role="alert" aria-live="polite"></div>

      <form id="signInForm" class="d-grid gap-3">
        <div>
          <label class="form-label" for="email" style="color: var(--text-main) !important;">Email</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="username" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;">
        </div>
        <div>
          <label class="form-label" for="password" style="color: var(--text-main) !important;">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;">
        </div>
        <button class="btn btn-primary w-100 fw-bold" type="submit" style="background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px;">Sign In</button>
      </form>

      <form id="recoveryForm" class="d-none d-grid gap-3">
        <p class="small mb-0" style="color: var(--text-muted);">Enter your account email and we will send a password reset link.</p>
        <div>
          <label class="form-label" for="recoveryEmail" style="color: var(--text-main) !important;">Email</label>
          <input class="form-control" id="recoveryEmail" name="email" type="email" autocomplete="email" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;">
        </div>
        <button class="btn btn-primary w-100 fw-bold" type="submit" style="background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px;">Send Reset Link</button>
      </form>

      <form id="updatePasswordForm" class="d-none d-grid gap-3">
        <p class="small mb-0" style="color: var(--text-muted);">Choose a new password for your account.</p>
        <div>
          <label class="form-label" for="newPassword" style="color: var(--text-main) !important;">New Password</label>
          <input class="form-control" id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;">
        </div>
        <button class="btn btn-primary w-100 fw-bold" type="submit" style="background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px;">Update Password</button>
      </form>

      <button id="recoveryToggle" class="btn btn-link mt-3 p-0" type="button" style="color: var(--accent); text-decoration: none;">Forgot password?</button>
      <p class="small text-muted text-center mt-3 mb-0">Access is provisioned by your administrator.</p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script type="module" src="js/login.js"></script>
  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
      const loadingScreen = document.getElementById('loadingScreen');
      if (loadingScreen) {
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.remove(), 300);
      }
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>

</body>
</html>
